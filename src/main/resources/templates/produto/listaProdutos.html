<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" href="/src/main/resources/templates/stylesheet.css">
</head>
<body>
    <h1>Lista de Produtos</h1>
    <h3><a href="/produtos/criar">
        Novo Produto</a></h3>

    <table>
        <tr>
            <td>Lista de Produtos</td>
        </tr>

        <tr>
            <th>Descrição</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Unidade</th>
            <th>Valor</th>
            <th colspan="2">Ações</th>
        </tr>

        <tr th:each="produto : ${produtos}">
            <td th:text="${produto.descricaoProduto}"></td>
            <td th:text="${produto.marcaProduto}"></td>
            <td th:text="${produto.modeloProduto}"></td>
            <td th:text="${produto.unidadeProduto}"></td>
            <td th:text="${produto.valorProduto}"></td>
            <td>
                <a th:href="@{/produtos/editar/{id}(id=${produto.idProduto})}">Editar</a>
                <a th:href="@{/produtos/excluir/{id}(id=${produto.idProduto})}">Excluir</a>
            </td>
        </tr>

    </table>
</body>
</html>
